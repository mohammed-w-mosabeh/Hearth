# nfpm config for the hearth .deb (`make deb`). VERSION comes from the Makefile.
name: hearth
arch: amd64
platform: linux
version: ${VERSION}
version_schema: none
section: admin
priority: optional
maintainer: Mohammed Mosabeh <219109774+mohammed-w-mosabeh@users.noreply.github.com>
description: |
  Local-first system manager and monitor for a single Debian machine.
  Monitors resources and manages apps, services, Docker, packages and more
  from a browser UI served on 127.0.0.1 only.
homepage: https://github.com/mohammed-w-mosabeh/hearth
license: Apache-2.0

depends:
  - systemd
  - xdg-utils
  - polkitd
  - passwd
  # App backups (SECURITY S12d): tar --zstd runs zstd.
  - zstd

# Disk health on the Disks page; without it the page says what to install.
recommends:
  - smartmontools

# Which services run old libraries. Only a suggestion: its apt hook changes
# what an upgrade does.
# Lynis: the audit on the Security page, which says how to install it.
suggests:
  - needrestart
  - lynis

