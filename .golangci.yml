version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - forbidigo
    - gosec
    - misspell
    - noctx
    - unconvert
  settings:
    depguard:
      rules:
        # SECURITY S7: os/exec only inside internal/safeexec.
        no-exec:
          files:
            - "$all"
            - "!**/internal/safeexec/**"
          deny:
            - pkg: os/exec
              desc: "process execution goes through internal/safeexec (SECURITY S7)"
    forbidigo:
      analyze-types: true
      forbid:
        # Other ways to start a process, also reserved for internal/safeexec.
        - pattern: '^os\.StartProcess$'
          msg: "use internal/safeexec (SECURITY S7)"
        - pattern: '^(syscall|unix)\.(Exec|ForkExec|StartProcess)$'
          msg: "use internal/safeexec (SECURITY S7)"
  exclusions:
    rules:
      - path: internal/safeexec/
        linters:
          - forbidigo

formatters:
  enable:
    - gofmt
    - goimports
